<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой MP3 Плеер</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24; /* Тёмный фон */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .player-container {
      background-color: #2b2b36;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 350px;
    }
    h2 {
      color: #ffffff;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
    }
    /* Стилизация самого плеера под тёмную тему */
    audio {
      width: 100%;
      outline: none;
      border-radius: 30px;
    }
    audio::-webkit-media-controls-panel {
      background-color: #444455; /* Цвет панели плеера */
    }
    audio::-webkit-media-controls-play-button,
    audio::-webkit-media-controls-mute-button {
      background-color: #ffffff;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <h2>🎵 Аудиоплеер</h2>
    
    <!-- Вот наш плеер -->
    <audio controls>
      <source src="goida_hRZ6vDr.mp3" type="audio/mpeg">
      Ваш браузер не поддерживает аудио.
    </audio>
  </div>

</body>
</html>
